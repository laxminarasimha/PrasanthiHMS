<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: the page may use the whole screen of a phone; the stylesheet keeps clear of notches and gesture bars. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6b2c91" />
    <!-- Added to a phone's home screen, the app opens in its own window with no address bar. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Prasanthi" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Prasanthi HMS</title>
    <!-- Before the app: if it cannot start on a phone, this says why instead of leaving a blank page. -->
    <script src="/boot-check.js"></script>
  </head>
  <body>
    <noscript>
      <p style="font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; line-height: 1.5">
        Prasanthi HMS needs JavaScript. In Chrome: Settings, then Site settings, then JavaScript: allow it for this site, and open the page again.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
